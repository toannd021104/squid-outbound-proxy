apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "squid-proxy.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid-proxy.labels" . | nindent 4 }}
data:
  squid.conf: |
    http_port {{ .Values.squid.port }}

    # ---- ACL: domain whitelist ----
    acl allowed_partners dstdomain{{ range .Values.squid.allowedDomains }} {{ . }}{{ end }}

    # ---- ACL: internal networks ----
    {{- range .Values.squid.localNetworks }}
    acl localnet src {{ . }}
    {{- end }}

    # ---- Access rules ----
    http_access allow localnet allowed_partners
    http_access deny all

    # ---- Logging ----
    access_log /var/log/squid/access.log combined
    cache_log /var/log/squid/cache.log

    # ---- Performance ----
    cache deny all
    forwarded_for off
    dns_nameservers {{ .Values.squid.dnsNameserver }}
